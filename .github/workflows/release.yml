name: Build obsidian plugin

on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - "*" # Push events to matching any tag format, i.e. 1.0, 20.15.10

env:
  PLUGIN_NAME: auto-anki

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v6

      # Copies this version's section of CHANGELOG.md, from its "## [<tag>]" heading up to
      # the next "## " heading. Runs first so a missing section stops the release early.
      - name: Extract release notes
        run: |
          awk -v tag="$GITHUB_REF_NAME" '
            /^## / { if (found) exit; if (index($0, "## [" tag "]") == 1) { found = 1; next } }
            found
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md"; then
            echo "::error::CHANGELOG.md has no section for $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"

      - name: Build plugin
        run: |
          npm ci
          npm run build
          mkdir "$PLUGIN_NAME"
          cp main.js manifest.json styles.css "$PLUGIN_NAME"
          zip -r "$PLUGIN_NAME-$GITHUB_REF_NAME.zip" "$PLUGIN_NAME"

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title="$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            main.js manifest.json styles.css \
            "$PLUGIN_NAME-$GITHUB_REF_NAME.zip"